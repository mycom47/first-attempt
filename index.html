<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tool Portal</title>
<script>
  // Applied before Tailwind loads so the correct theme paints on first frame.
  (function () {
    var stored = localStorage.getItem('theme');
    var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    if (theme === 'dark') document.documentElement.classList.add('dark');
  })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class' };
</script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100">

  <header class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 px-6 py-4">
    <h1 class="text-lg font-semibold">Tool Portal</h1>
    <button id="theme-toggle" type="button"
      class="rounded-md border border-slate-300 dark:border-slate-600 px-3 py-1.5 text-sm hover:bg-slate-100 dark:hover:bg-slate-800">
      <span id="theme-toggle-label">Dark mode</span>
    </button>
  </header>

  <div class="flex">
    <nav class="w-56 shrink-0 border-r border-slate-200 dark:border-slate-700 p-4 space-y-1">
      <button type="button" data-tool="word-counter"
        class="tool-nav-btn w-full text-left rounded-md px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-800">
        Word Counter
      </button>
      <button type="button" data-tool="json-formatter"
        class="tool-nav-btn w-full text-left rounded-md px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-800">
        JSON Formatter
      </button>
    </nav>

    <main class="flex-1 p-6">
      <p id="empty-state" class="text-slate-500 dark:text-slate-400 text-sm">
        Select a tool from the left to get started.
      </p>

      <section id="word-counter" data-tool-card class="hidden max-w-xl rounded-lg border border-slate-200 dark:border-slate-700 p-5">
        <div class="flex items-center justify-between mb-2">
          <h2 class="font-medium">Word Counter</h2>
          <button type="button" class="close-card-btn text-slate-400 hover:text-slate-700 dark:hover:text-slate-200" aria-label="Close">✕</button>
        </div>
        <p class="text-sm text-slate-500 dark:text-slate-400">Placeholder — tool logic not implemented yet.</p>
      </section>

      <section id="json-formatter" data-tool-card class="hidden max-w-xl rounded-lg border border-slate-200 dark:border-slate-700 p-5">
        <div class="flex items-center justify-between mb-2">
          <h2 class="font-medium">JSON Formatter</h2>
          <button type="button" class="close-card-btn text-slate-400 hover:text-slate-700 dark:hover:text-slate-200" aria-label="Close">✕</button>
        </div>
        <p class="text-sm text-slate-500 dark:text-slate-400">Placeholder — tool logic not implemented yet.</p>
      </section>
    </main>
  </div>

  <script>
    // Theme toggle
    var toggleBtn = document.getElementById('theme-toggle');
    var toggleLabel = document.getElementById('theme-toggle-label');

    function syncToggleLabel() {
      toggleLabel.textContent = document.documentElement.classList.contains('dark') ? 'Light mode' : 'Dark mode';
    }
    syncToggleLabel();

    toggleBtn.addEventListener('click', function () {
      document.documentElement.classList.toggle('dark');
      var isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      syncToggleLabel();
    });

    // Nav open/close mechanism
    var navButtons = document.querySelectorAll('.tool-nav-btn');
    var cards = document.querySelectorAll('[data-tool-card]');
    var emptyState = document.getElementById('empty-state');
    var activeTool = null;

    function closeAll() {
      cards.forEach(function (card) { card.classList.add('hidden'); });
      navButtons.forEach(function (btn) { btn.classList.remove('bg-slate-200', 'dark:bg-slate-700'); });
      emptyState.classList.remove('hidden');
      activeTool = null;
    }

    function openTool(name) {
      closeAll();
      var card = document.getElementById(name);
      if (!card) return;
      card.classList.remove('hidden');
      emptyState.classList.add('hidden');
      var btn = document.querySelector('.tool-nav-btn[data-tool="' + name + '"]');
      if (btn) btn.classList.add('bg-slate-200', 'dark:bg-slate-700');
      activeTool = name;
    }

    navButtons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var tool = btn.getAttribute('data-tool');
        if (activeTool === tool) {
          closeAll();
        } else {
          openTool(tool);
        }
      });
    });

    cards.forEach(function (card) {
      var closeBtn = card.querySelector('.close-card-btn');
      closeBtn.addEventListener('click', closeAll);
    });
  </script>
</body>
</html>
